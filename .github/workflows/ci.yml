name: RecoveryOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend (FastAPI, Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recoveryos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/pyproject.toml"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: apps/api
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff Lint Check
        working-directory: apps/api
        run: |
          uv run ruff check .

      - name: Ruff Format Check
        working-directory: apps/api
        run: |
          uv run ruff format --check .

      - name: Mypy Typecheck
        working-directory: apps/api
        run: |
          uv run mypy .

      - name: Alembic Migration Check
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/recoveryos
          SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recoveryos
        run: |
          uv run alembic upgrade head
          uv run alembic current

      - name: Run Pytest Test Suite
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/recoveryos
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest -v

  frontend-quality:
    name: Frontend (Next.js, ESLint, TypeScript, Vitest, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11.2.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: TypeScript Typecheck
        run: pnpm --filter @recoveryos/web typecheck

      - name: ESLint Check
        run: pnpm --filter @recoveryos/web lint

      - name: Vitest Test Suite
        run: pnpm --filter @recoveryos/web test

      - name: Next.js Production Build
        run: pnpm --filter @recoveryos/web build
